name: Deploy dos espelhos

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-mirrors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  netlify:
    name: Publicar em netlify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Preparar cópia pública limpa
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .deploy
          mkdir -p .deploy/site

          rsync -a \
            --exclude=".git/" \
            --exclude=".github/" \
            --exclude=".netlify/" \
            --exclude=".wrangler/" \
            --exclude=".deploy/" \
            --exclude="node_modules/" \
            --exclude="_backup*/" \
            --exclude="_teste*/" \
            --exclude="*.log" \
            --exclude="*.tmp" \
            --exclude=".env" \
            --exclude=".env.*" \
            --exclude="CNAME" \
            ./ .deploy/site/

          test -f .deploy/site/index.html
          test -f .deploy/site/preview.css
          test -f .deploy/site/preview.js
          test -d .deploy/site/assets
          test ! -e .deploy/site/CNAME

          echo "Total de arquivos preparados:"
          find .deploy/site -type f | wc -l

      - name: Vincular projeto Netlify no runner
        shell: bash
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -euo pipefail
          test -n "${NETLIFY_AUTH_TOKEN}"
          test -n "${NETLIFY_SITE_ID}"

          mkdir -p .netlify
          printf '{"siteId":"%s"}\n' "${NETLIFY_SITE_ID}" > .netlify/state.json

      - name: Publicar no Netlify
        shell: bash
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -euo pipefail

          npx --yes netlify-cli@27.0.0 deploy \
            --prod \
            --no-build \
            --dir .deploy/site \
            --auth "${NETLIFY_AUTH_TOKEN}" \
            --message "GitHub Actions: ${GITHUB_SHA}"

      - name: Verificar Netlify publicado
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            "https://siddevbr-mirror.netlify.app/?commit=${GITHUB_SHA}" \
            --output /tmp/netlify.html

          grep -qi "<html" /tmp/netlify.html
          echo "Publicação Netlify confirmada."

  cloudflare:
    name: Publicar em cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Preparar cópia pública limpa
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .deploy
          mkdir -p .deploy/site

          rsync -a \
            --exclude=".git/" \
            --exclude=".github/" \
            --exclude=".netlify/" \
            --exclude=".wrangler/" \
            --exclude=".deploy/" \
            --exclude="node_modules/" \
            --exclude="_backup*/" \
            --exclude="_teste*/" \
            --exclude="*.log" \
            --exclude="*.tmp" \
            --exclude=".env" \
            --exclude=".env.*" \
            --exclude="CNAME" \
            ./ .deploy/site/

          test -f .deploy/site/index.html
          test -f .deploy/site/preview.css
          test -f .deploy/site/preview.js
          test -d .deploy/site/assets
          test ! -e .deploy/site/CNAME

          echo "Total de arquivos preparados:"
          find .deploy/site -type f | wc -l

      - name: Validar credenciais da Cloudflare
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"

      - name: Publicar no Cloudflare Pages
        id: cloudflare-deploy
        uses: cloudflare/wrangler-action@v3
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first
          WRANGLER_SEND_METRICS: "false"
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.114.0"
          command: pages deploy .deploy/site --project-name=siddevbr-cloud-mirror --branch=main --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verificar Cloudflare publicado
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            "https://siddevbr-cloud-mirror.pages.dev/?commit=${GITHUB_SHA}" \
            --output /tmp/cloudflare.html

          grep -qi "<html" /tmp/cloudflare.html
          echo "Publicação Cloudflare confirmada."
