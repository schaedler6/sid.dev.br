name: Deploy dos espelhos

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-mirrors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicar em ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        target:
          - netlify
          - cloudflare

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Preparar cópia pública limpa
        shell: bash
        run: |
          set -euo pipefail

          PUBLISH_DIR="${RUNNER_TEMP}/sid-dev-br-public"
          mkdir -p "${PUBLISH_DIR}"

          rsync -a \
            --exclude=".git/" \
            --exclude=".github/" \
            --exclude=".netlify/" \
            --exclude=".wrangler/" \
            --exclude="node_modules/" \
            --exclude="_backup*/" \
            --exclude="_teste*/" \
            --exclude="*.log" \
            --exclude="*.tmp" \
            --exclude=".env" \
            --exclude=".env.*" \
            --exclude="CNAME" \
            ./ "${PUBLISH_DIR}/"

          test -f "${PUBLISH_DIR}/index.html"
          test -f "${PUBLISH_DIR}/preview.css"
          test -f "${PUBLISH_DIR}/preview.js"
          test -d "${PUBLISH_DIR}/assets"
          test ! -e "${PUBLISH_DIR}/CNAME"
          test ! -d "${PUBLISH_DIR}/.git"
          test ! -d "${PUBLISH_DIR}/.github"
          test ! -d "${PUBLISH_DIR}/.netlify"
          test ! -d "${PUBLISH_DIR}/.wrangler"

          echo "PUBLISH_DIR=${PUBLISH_DIR}" >> "${GITHUB_ENV}"

          echo "Arquivos preparados para publicação:"
          find "${PUBLISH_DIR}" -type f | sort
          echo "Total de arquivos:"
          find "${PUBLISH_DIR}" -type f | wc -l

      - name: Validar credenciais do Netlify
        if: matrix.target == 'netlify'
        shell: bash
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -euo pipefail
          test -n "${NETLIFY_AUTH_TOKEN}"
          test -n "${NETLIFY_SITE_ID}"

      - name: Publicar no Netlify
        if: matrix.target == 'netlify'
        shell: bash
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -euo pipefail

          npx --yes netlify-cli@27.0.0 deploy \
            --prod \
            --no-build \
            --site "${NETLIFY_SITE_ID}" \
            --auth "${NETLIFY_AUTH_TOKEN}" \
            --dir "${PUBLISH_DIR}" \
            --message "GitHub Actions: ${GITHUB_SHA}"

      - name: Validar credenciais da Cloudflare
        if: matrix.target == 'cloudflare'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"

      - name: Publicar no Cloudflare Pages
        if: matrix.target == 'cloudflare'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          for tentativa in 1 2 3 4; do
            echo "Tentativa ${tentativa} de 4 para publicar no Cloudflare Pages"

            if npx --yes wrangler@4.114.0 pages deploy "${PUBLISH_DIR}" \
              --project-name "siddevbr-cloud-mirror" \
              --branch "main" \
              --commit-hash "${GITHUB_SHA}"; then
              exit 0
            fi

            if [ "${tentativa}" -eq 4 ]; then
              echo "Falha definitiva após 4 tentativas." >&2
              exit 1
            fi

            espera=$((tentativa * 15))
            echo "Falha transitória. Nova tentativa em ${espera} segundos."
            sleep "${espera}"
          done

      - name: Verificar endereço publicado
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ matrix.target }}" = "netlify" ]; then
            TARGET_URL="https://siddevbr-mirror.netlify.app"
          else
            TARGET_URL="https://siddevbr-cloud-mirror.pages.dev"
          fi

          echo "Verificando ${TARGET_URL}"

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            "${TARGET_URL}/?commit=${GITHUB_SHA}" \
            --output "/tmp/site.html"

          grep -qi "<html" "/tmp/site.html"

          echo "Publicação confirmada em ${TARGET_URL}"
